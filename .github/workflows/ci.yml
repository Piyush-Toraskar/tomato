name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_uber_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test

      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: mini_uber_test

      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/mini_uber_test

      TEST_DB_NAME: mini_uber_test
      RUN_POSTGRES_TESTS: "1"

      SECRET_KEY: ci-only-secret-key-not-used-in-production

      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      EMAIL_VERIFICATION_EXPIRE_MINUTES: 60
      PASSWORD_RESET_EXPIRE_MINUTES: 30

      EXPOSE_DEBUG_TOKENS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations
        run: alembic upgrade head

      - name: Run test suite
        run: pytest -v